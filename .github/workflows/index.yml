name: index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/index.yml'

concurrency:
  group: dsh-plugin-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Unit tests (format mirror)
        run: npm test

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover.mjs

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_BASELINE: '0.2.1'
          INDEX_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json
        run: node scripts/build.mjs

      - name: Validate (official validator cross-check)
        env:
          INDEX_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json
        run: node scripts/validate.mjs

      - name: Commit regenerated artifacts
        id: publish
        run: |
          git config user.name "dsh-plugin-index[bot]"
          git config user.email "dsh-plugin-index[bot]@users.noreply.github.com"
          git add site data/corpus.json data/build-report.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No index change; skipping commit."
          else
            git commit -m "chore(index): rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
