name: pr

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Unit tests
        run: npm test
      - name: Published index still validates
        run: node scripts/validate.mjs
      - name: Policy files are valid JSON
        run: |
          for f in data/sources.json data/categories.json data/reviewed.json data/blocklist.json data/i18n.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Review ledger changes need a CODEOWNER
        if: github.event_name == 'pull_request'
        run: echo "CODEOWNERS review required for data/reviewed.json and data/blocklist.json"
